<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Card</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <img id="chara" src="IMG_5318.png">
      </a-assets>

      <!-- ファイル名が .patt.txt のままでも動くように指定 -->
      <a-marker type="pattern" url="pattern-marker.patt.txt">
        <a-image src="#chara" position="0 0.5 0" rotation="-90 0 0" width="1" height="1.5"></a-image>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
